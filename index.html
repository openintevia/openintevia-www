<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTEVIA</title>
  <style>
    body {
      background: #0d0d0d;
      color: #f2f2f2;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    .hat-mark {
      font-size: 2.4rem;
      margin-bottom: 1.25rem;
      opacity: 0.9;
    }

    h1 {
      font-size: clamp(2.75rem, 8vw, 4.5rem);
      letter-spacing: 0.08em;
      margin: 0 0 0.75rem;
      font-weight: 700;
    }

    .tagline {
      opacity: 0.72;
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      margin: 0 0 1.5rem;
    }

    .subline {
      opacity: 0.48;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 1.75rem;
    }

    .closing-line {
      opacity: 0.62;
      font-size: 1rem;
      font-style: italic;
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <div class="hat-mark" aria-hidden="true">🎩</div>
    <h1>INTEVIA</h1>
    <p class="tagline">The Living Organism is forming.</p>
    <p class="subline">Open source. Human-centred. Governance-led.</p>
    <p class="closing-line">Let the work speak for itself.</p>
  </main>
</body>
</html>
